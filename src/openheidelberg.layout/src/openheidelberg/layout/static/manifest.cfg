[theme]
title = OpenHeidelberg Layouts
description = Diazo theme: one theme file per page layout, the standard interaktiv.theme for all other pages
doctype = <!DOCTYPE html>
rules = /++theme++openheidelberg.layout/rules.xml
prefix = /++theme++openheidelberg.layout
enabled-bundles =
disabled-bundles =

[theme:parameters]
language = portal_state/language
ajax_load = python:request.form.get('ajax_load')
# Preview of site-layout for everything else: set the cookie openheidelberg_layout=new in the browser.
# Cut-over for all visitors: change the expression to python:'1'.
site_layout_enabled = python:'1' if request.cookies.get('openheidelberg_layout') == 'new' else ''
