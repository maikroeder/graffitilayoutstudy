# graffitilayoutstudy — a fresh Graffiti (Plone 6.1.2) with the full
# Interaktiv Tiles Editor package set, plus the OpenHeidelberg layout packages.
#
# Run ./bootstrap.sh first (creates .venv, clones the upstream Graffiti
# checkout into upstream/graffiti), then: bin/buildout

[settings]
eggs +=
    Products.PrintingMailHost

[buildout]
extends =
    buildout.d/standalone.cfg
