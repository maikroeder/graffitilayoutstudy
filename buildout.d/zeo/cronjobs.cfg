[settings]
eggs +=
    z3c.recipe.usercrontab

# start supervisor daemon on server reboot
[cronjob-restart-on-reboot]
recipe = z3c.recipe.usercrontab
times = @reboot
command = ${buildout:directory}/bin/supervisord

# pack ZODB daily
[cronjob-zeopack]
recipe = z3c.recipe.usercrontab
times = @daily
command = ${buildout:bin-directory}/zeopack
