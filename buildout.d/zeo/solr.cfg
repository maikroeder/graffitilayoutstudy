[buildout]
parts +=
    solr

[solr]
recipe = interaktiv.recipe.solr
src = https://archive.apache.org/dist/lucene/solr/8.11.1/solr-8.11.1.tgz
sha = https://archive.apache.org/dist/lucene/solr/8.11.1/solr-8.11.1-src.tgz.sha512

basepath = /solr

config_directory = solr_config
cores =
    plone
host = ${settings:solr-host}
port = ${settings:solr-port}
java_options =
  -Dcom.sun.management.jmxremote=false
# bind Jetty to the solr host (localhost), Solr has no authentication either
  -Djetty.host=${settings:solr-host}
  -Djava.rmi.server.hostname=${settings:jmx-host}
  -Djava.io.tmpdir=${buildout:directory}/var/solr/tmp
  -Dsolr.allow.unsafe.resourceloading=true
  -server
  -Xms${settings:solr-min-ram}
  -Xmx${settings:solr-max-ram}
  -XX:-UseLargePages
  -XX:-UsePerfData
