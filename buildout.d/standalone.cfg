[plonesite-settings]
instance-name = instance
zeoserver-name =

[buildout]
extends =
    base/default-settings.cfg
    base/core.cfg
#   #####################
    plone/install.cfg
    plone/cronjobs.cfg
    plone/test.cfg
#   #####################
    zeo/solr.cfg

develop =
    ${settings:develop}
parts +=
    instance

[instance]
recipe = plone.recipe.zope2instance
user = ${settings:instance-user}:${settings:instance-password}
ip-address = ${settings:instance-address}
http-address = ${settings:instance-port}
debug-mode = on
http-fast-listen = on
verbose-security = on
deprecation-warnings = on
blob-storage = var/blobstorage
environment-vars =
    ENVIRONMENT ${settings:environment}
    WEB_DOMAIN localhost:2000
#     CATALOG_OPTIMIZATION_DISABLED 1
    ${settings:environment-vars}
eggs =
    Plone
    ${settings:eggs}
