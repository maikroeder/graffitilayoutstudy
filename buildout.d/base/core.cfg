[buildout]
parts +=
    precompile
    zopepy

extends =
    https://dist.plone.org/release/5.2.2/versions.cfg
    sources.cfg
    versions.cfg

index = https://pypi.python.org/simple/

find-links =
    https://dist.plone.org/release/5.2.2/
    http://dist.plone.org/thirdparty

versions = versions
offline = false
newest = true
download-cache = ${buildout:directory}/download-cache

allow-hosts =
    *.pypi.org
    *.pythonhosted.org
    *.python.org
    *.plone.org
    plone.org

[precompile]
recipe = plone.recipe.precompiler
eggs = ${settings:eggs}
compile-mo-files = true

[zopepy]
recipe = zc.recipe.egg
eggs = ${settings:eggs}
interpreter = zopepy
scripts = zopepy