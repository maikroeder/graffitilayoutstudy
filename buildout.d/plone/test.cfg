[buildout]
parts +=
    test
    test_with_code_coverage
    coverage_package

[test]
# Files get generated to "parts/test/testreports/*.xml". (JUnit)
recipe = collective.xmltestreport
eggs = ${settings:eggs-test}
environment = environment
relative-paths = true
defaults = ['--xml', '--color', '--auto-progress', '--ignore_dir=bower_components', '--ignore_dir=node_modules']

[test_with_code_coverage]
# Generate coverage XML/HTML report
# File gets generated to "coverage/reports/xml/coverage.xml". (Cobertura)
recipe = collective.recipe.template
input = inline:
    #!/bin/sh

    # Create folder for results
    [ -z "$COVERAGE_FOLDER" ] && export COVERAGE_FOLDER=${buildout:directory}/coverage;
    mkdir -p "$COVERAGE_FOLDER"

    # Set output file for coverage data
    export COVERAGE_FILE="$COVERAGE_FOLDER/.coverage"

    # Remove old results
    echo "Erase old coverage results."
    bin/coverage erase
    [ -f "$COVERAGE_FOLDER/reports" ] &&  rm -r "$COVERAGE_FOLDER/reports"

    # Source folders
    MODULE_PREFIX="${settings:coverage-module-prefix}"
    SRC_PATHS_LIST="${settings:coverage-source-paths}"
    SRC_PATHS_STRING=$(echo "$SRC_PATHS_LIST" | paste -s -d, -)

    # Runs a code coverage analysis on top of the "test" script for
    # all packages. The data will be collected in a ".coverage" output file
    # in the buildout directory.
    echo "Run test coverage analysis"
    bin/coverage run -p --source="$SRC_PATHS_STRING" --omit="*/tests/*,*/testing.py" bin/test --all -m ^"$MODULE_PREFIX"[.]  --xml -vvv --color --auto-progress --ignore_dir=bower_components --ignore_dir=node_modules

    # Combine all package analysis
    echo "Combine data."
    bin/coverage combine

    # Generates a "coverage.html" file that Human can read.
    echo "Create test coverage HTML report."
    bin/coverage html -d "$COVERAGE_FOLDER/reports/html"
    echo "Test coverage report finished."

    # Generates a "coverage.xml" file that GitLab CI or PyCharm can read
    echo "Create test coverage XML report."
    bin/coverage xml -o $COVERAGE_FOLDER/reports/xml/coverage.xml
    echo "Test coverage report finished."
output = ${buildout:directory}/bin/test_with_code_coverage
mode = 755

[coverage_package]
# Collecting coverage information from python
recipe = zc.recipe.egg
eggs =
    coverage

[environment]
BUILDOUT_DIR = ${buildout:directory}
INSTANCE_HOME = ${buildout:directory}/parts/test
CLIENT_HOME = ${buildout:directory}/var/test
TEST_CHECK_REMOVAL = false
ENVIRONMENT = test
PYTHONWARNINGS = ignore::DeprecationWarning
