[buildout]
parts +=
    update_styleguide
    update_styleguide_trigger

[update_styleguide]
recipe = collective.recipe.template
input = inline:
    #!/bin/sh
    export BUILDOUT_DIR="${buildout:directory}"

    # Run Node Preinstall - e.g. combines multiple "package.json"s to one
    npm run preinstall || { echo "Command 'npm preinstall' failed" ;exit 1; }

    # Install requirements from "package.json"
    npm install || { echo "Command 'npm install' failed" ;exit 1; }

    # Run Tiles Styleguide Generator - e.g. creates "var/_styleguide.less"
    ${buildout:bin-directory}/zopepy ${buildout:directory}/src/interaktiv.basetiles/src/interaktiv/basetiles/utilities/styleguide.py || { echo "Command './bin/zopepy ../interaktiv/basetiles/utilities/styleguide.py' failed" ;exit 1; }

    # Run default grun task - e.g. compile less/js files
    node_modules/grunt-cli/bin/grunt "$@" || { echo "Command 'grunt' failed" ;exit 1; }
output = ${buildout:directory}/bin/update_styleguide
mode = 755

[update_styleguide_trigger]
recipe = collective.recipe.cmd
shell = /bin/bash
on_install = true
on_update = true
cmds = ${buildout:bin-directory}/update_styleguide || { echo "'update_styleguide' failed" ;exit 1; }

